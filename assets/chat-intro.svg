<svg width="920" height="300" viewBox="0 0 920 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: 700 22px Arial, sans-serif;
      fill: #F5F0E8;
    }

    .bubbleText {
      font: 500 17px Arial, sans-serif;
      fill: #F5F0E8;
    }

    .bubble {
      fill: #3A3A3D;
    }

    .dot {
      fill: #8E8E93;
    }
  </style>

  <!-- Title -->
  <text x="20" y="35" class="title">Hi there 👋</text>

  <!-- Typing bubble -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="1.8s" begin="0s" fill="freeze"/>
    <rect x="20" y="58" width="95" height="42" rx="21" class="bubble"/>
    <circle cx="48" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0s" repeatCount="3"/>
    </circle>
    <circle cx="68" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0.2s" repeatCount="3"/>
    </circle>
    <circle cx="88" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0.4s" repeatCount="3"/>
    </circle>
  </g>

  <!-- Bubble 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.9s" fill="freeze"/>
    <rect x="20" y="58" width="280" height="42" rx="21" class="bubble"/>
    <text x="38" y="85" class="bubbleText">Hi, I'm Aira — a Data Engineering student based in Stockholm.</text>
  </g>

  <!-- Bubble 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.8s" fill="freeze"/>
    <rect x="20" y="112" width="860" height="66" rx="22" class="bubble"/>
    <text x="38" y="139" class="bubbleText">I’m building a strong foundation in analytics engineering, data platforms,</text>
    <text x="38" y="164" class="bubbleText">and the systems that power AI, reporting, and better business decision-making.</text>
  </g>

  <!-- Bubble 3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="3.7s" fill="freeze"/>
    <rect x="20" y="190" width="880" height="66" rx="22" class="bubble"/>
    <text x="38" y="217" class="bubbleText">I work with Python, SQL, data ingestion, storage, ETL/ELT, dbt, and data modeling,</text>
    <text x="38" y="242" class="bubbleText">while continuing to grow into orchestration, cloud workflows, and real-time systems.</text>
  </g>
</svg>
