<svg width="960" height="390" viewBox="0 0 960 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font: 700 22px Arial, sans-serif;
      fill: #F5F0E8;
    }

    .bubbleText {
      font: 500 16px Arial, sans-serif;
      fill: #F5F0E8;
    }

    .bubble {
      fill: #3A3A3D;
    }

    .dot {
      fill: #8E8E93;
    }
  </style>

  <!-- Title -->
  <text x="20" y="35" class="title">Hi there 👋</text>

  <!-- Typing bubble -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="1.8s" begin="0s" fill="freeze"/>
    <rect x="20" y="58" width="95" height="42" rx="21" class="bubble"/>
    <circle cx="48" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0s" repeatCount="3"/>
    </circle>
    <circle cx="68" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0.2s" repeatCount="3"/>
    </circle>
    <circle cx="88" cy="79" r="5" class="dot">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" begin="0.4s" repeatCount="3"/>
    </circle>
  </g>

  <!-- Bubble 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.9s" fill="freeze"/>
    <rect x="20" y="58" width="870" height="74" rx="24" class="bubble"/>
    <text x="38" y="86" class="bubbleText">Hi, I'm Aira — a Data Engineering student based in Stockholm, building my foundation in analytics engineering,</text>
    <text x="38" y="111" class="bubbleText">AI-ready data platforms, real-time systems, and business decision-making through data.</text>
  </g>

  <!-- Bubble 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="2.9s" fill="freeze"/>
    <rect x="20" y="150" width="910" height="98" rx="24" class="bubble"/>
    <text x="38" y="178" class="bubbleText">I work with Python, SQL, data ingestion, data storage, ETL/ELT transformations, dbt, and data modeling.</text>
    <text x="38" y="203" class="bubbleText">So far, I have studied RDBMS and relational database modeling, and I am also self-learning star schema,</text>
    <text x="38" y="228" class="bubbleText">fact tables, dimension tables, and stronger analytics engineering patterns.</text>
  </g>

  <!-- Bubble 3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="3.9s" fill="freeze"/>
    <rect x="20" y="266" width="910" height="98" rx="24" class="bubble"/>
    <text x="38" y="294" class="bubbleText">I am currently strengthening batch processing while learning real-time processing concepts with Kafka.</text>
    <text x="38" y="319" class="bubbleText">I am also self-teaching data pipelines and orchestration with Airflow, with Dagster on my roadmap.</text>
    <text x="38" y="344" class="bubbleText">And of course, more — check out the projects I have built below. :)</text>
  </g>
</svg>
